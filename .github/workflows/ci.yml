name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Laravel ${{ matrix.laravel }} · PHP ${{ matrix.php }} · ${{ matrix.db.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        laravel: ['10', '11', '12', '13']
        php: ['8.3', '8.4', '8.5']
        db:
          - { name: 'MySQL 8.4', image: 'mysql:8.4', connection: mysql }
        exclude:
          # PHP versions those Laravel releases do not support.
          - { laravel: '10', php: '8.4' }
          - { laravel: '10', php: '8.5' }
          - { laravel: '11', php: '8.5' }
        include:
          - laravel: '13'
            php: '8.5'
            db: { name: 'MariaDB 11.4', image: 'mariadb:11.4', connection: mariadb }

    services:
      database:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: custom_reports_testing
          MARIADB_ROOT_PASSWORD: password
          MARIADB_DATABASE: custom_reports_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword || healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_CONNECTION: ${{ matrix.db.connection }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: custom_reports_testing
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, pdo_mysql, gd, intl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-l${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-l${{ matrix.laravel }}-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies --with "laravel/framework:^${{ matrix.laravel }}.0"
        env:
          # Laravel 10 and 11 are end-of-life and every release has open advisories, which
          # Composer 2.9+ refuses to install. Allow them for those rows only, to test them.
          COMPOSER_NO_SECURITY_BLOCKING: ${{ (matrix.laravel == '10' || matrix.laravel == '11') && '1' || '' }}

      - name: Run tests
        run: vendor/bin/phpunit

  static-analysis:
    name: Pint · PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, mbstring, pdo_mysql, gd, intl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-8.5-${{ hashFiles('composer.json') }}
          restore-keys: composer-8.5-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
